# Project configuration: every path, source file and setting in one place.
# Paths are relative to the project folder.

source:
  title: "NCSE v2.0: A Dataset of OCR-Processed 19th Century English Newspapers"
  author: "Jonathan (Jonno) Bourne"
  year: 2025
  doi: "10.5522/04/28381610"
  figshare_version: 1
  licence: "CC BY 4.0"
  # Files downloaded by `ncse acquire`. md5 values are the checksums published on figshare.
  files:
    - name: NCSE_v2.zip
      url: https://ndownloader.figshare.com/files/52260821
      md5: 7438b975c76783e777b7704ea7ddcf8c
      size: 817784124
    - name: classification_data.zip
      url: https://ndownloader.figshare.com/files/52260923
      md5: b6452f60b4c27a5ca96a892a979ab5a3
      size: 153326947
    - name: class_mappings.zip
      url: https://ndownloader.figshare.com/files/52260941
      md5: 53e432fdd652a37c65641cbc2a04730e
      size: 750

paths:
  raw: data/raw              # downloads and unpacked files (not in git)
  interim: data/interim      # intermediate files from inspection (not in git)
  corpus: data/corpus/full   # the full prepared corpus (not in git; rebuilt by script)
  corpus_sample: corpus_sample  # small fixed sample corpus (in git; for sample mode and tests)
  raw_sample: raw_sample     # small extract of the original NCSE rows (in git; test data for stages 2–3)
  reports: reports           # generated reports (in git)
  logs: logs                 # run logs (not in git)
  dist: dist                 # corpus release package made by `ncse package` (not in git)
  downloads: data/downloads  # corpus release downloaded by `ncse fetch` (not in git)
  annotation: data/annotation  # LLM answers and checked results, one file per article and step (not in git)

# The two periodicals.
#   file:   the name the NCSE files use for this periodical
#   series: which issue series to use (the part of the NCSE issue_id before the date).
#           Monthly Repository: MRP = regular issues (SMRP supplements, FMRP front matter
#           and EMRP are left out, D-011). The Leader: LDR = town edition (the CLD country
#           edition repeats most of the same text and is left out, D-010).
#   code:   prefix of our article identifiers
periodicals:
  - name: The Monthly Repository
    file: Monthly_Repository
    series: [MRP]
    code: MRP
  - name: The Leader
    file: Leader
    series: [LDR]
    code: LDR

# The published corpus (D-008, D-019). Download address:
#   https://github.com/<repository>/releases/download/corpus-v<version>/ncse-arts-corpus-v<version>.zip
release:
  repository: maslinych/criticism_workshop
  version: "1.0"
  # SHA-256 checksum of the published zip. Filled in after publishing, so that `ncse fetch`
  # checks the download against this value; until then it uses the published .sha256 file.
  sha256: 385ea919c2a0ee55317f73d87ba83817bc219ae982901104aded284ade596dec  # corpus-v1.0, published 2026-11-22

# Selection rule D-002 (provisional): NCSE text type and topic labels, as named in
# the NCSE class mapping files.
selection:
  text_type: article
  topic: arts_culture_entertainment_media

# Article rebuild (D-016, provisional; replaces D-012). See src/ncse/rebuild.py.
rebuild:
  # A unit (text from one heading to the next) is taken whole if it spans at most
  # max_pages pages and either opens with arts text or has at least whole_share of
  # its characters in boxes meeting the selection rule.
  max_pages: 3
  whole_share: 0.5
  # Otherwise only its selected part is taken: how many boxes without the selection
  # labels may sit between two selected boxes and still count as one article.
  max_gap: 2
  # NCSE box classes that are left out of the corpus text (D-013).
  # figure = the OCR model's description of a picture; table = a table re-typed by the model.
  exclude_classes: [figure, table]

# Text invented by the OCR model (D-017): such boxes are left out of the corpus and
# listed in excluded_boxes.csv. See src/ncse/invented.py.
invented:
  token_limit: 2000    # the OCR model stopped after this many output tokens per part of a box
  repeat_ngram: 8      # length (in words) of the sequences checked for repetition
  repeat_share: 0.3    # a box is a loop if at least this share of its sequences are repeats

# Corpus sample for sample mode and tests (corpus_sample/).
sample:
  articles_per_periodical: 12
  min_chars: 1500   # skip very short fragments so the sample is useful to read
  seed: 1850

# Raw NCSE sample (raw_sample/, D-021): original NCSE rows for a few complete articles,
# as test data for stages 2–3. Numbers are articles per periodical.
raw_sample:
  whole: 3        # taken as whole units
  part: 2         # taken as selected parts of a longer unit
  invented: 1     # with a box of invented text left out
  max_pages: 2    # only articles whose unit spans at most this many pages
  seed: 1850

# Annotation stages (D-022). Prompts are in prompts/<step>/<version>/.
# Model names refer to the LiteLLM service; the address and key come from environment
# variables, never from this file. Models are chosen before the pilot.
#   temperature: 0 makes answers as repeatable as the model allows (null = model default).
#   max_tokens: upper limit on the length of one answer (null = model default).
#   response_format: json_object asks the service to return bare JSON, if the model
#     supports it (null = do not ask; the checks reject anything else either way).
annotation:
  analyst:
    prompt_version: v1
    model: null          # to be chosen with the project owner
    temperature: 0
    max_tokens: 8000
    response_format: json_object
  reviewer:
    prompt_version: v1
    model: null          # may differ from the analyst's model (evidence-and-review.md, section 5)
    temperature: 0
    max_tokens: 8000
    response_format: json_object
  max_retries: 2         # extra attempts after an answer fails the checks
  retry_echo_chars: 2000 # an answer cut off at the length limit is sent back with the retry
                         # only up to this many characters (D-026)
  concurrency: 4         # articles sent at the same time

# Connection to the LiteLLM service. Only the NAMES of the environment variables are
# here; set them in your shell, e.g. export LITELLM_BASE_URL=https://.../v1
llm:
  base_url_env: LITELLM_BASE_URL   # address of the service, up to and including /v1 if it has one
  api_key_env: LITELLM_API_KEY     # your personal key
  timeout: 600           # seconds to wait for one answer
  transport_retries: 5   # tries after network errors or "busy" answers (not counted as attempts)
  pause: 10              # seconds before the first such try; doubles each time
